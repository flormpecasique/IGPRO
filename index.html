<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram Downloader – Download Photos, Videos, Reels, Stories & Highlights</title>

<meta name="description" content="Download Instagram Reels, Photos, Videos, Stories and Highlights in HD quality. Free Instagram downloader.">
<meta name="keywords" content="instagram downloader, download instagram reels, instagram video downloader, download instagram photos">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
fontFamily: { sans: ['Inter', 'sans-serif'] },
colors: {
primary: {
400:'#f472b6',
500:'#ec4899',
600:'#db2777',
700:'#be185d'
}
}
}
}
}
</script>

<style>
.glass{
background:rgba(255,255,255,.7);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.2);
}
.dark .glass{
background:rgba(15,23,42,.7);
border-color:rgba(255,255,255,.1);
}
</style>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans">

<nav class="py-4 px-6 glass sticky top-0">
<div class="max-w-7xl mx-auto flex justify-between items-center">

<div class="flex items-center gap-2 text-primary-600 font-bold text-xl">
<i data-lucide="instagram"></i>
IG DL PRO
</div>

<div class="flex gap-4">

<button onclick="toggleLanguage()" class="px-3 py-1 bg-slate-200 dark:bg-slate-800 rounded">
<span id="lang-label">ES</span>
</button>

<button onclick="toggleDarkMode()" class="px-3 py-1 bg-slate-200 dark:bg-slate-800 rounded">
🌙
</button>

</div>
</div>
</nav>


<header class="py-20 text-center px-6">
<h1 class="text-4xl md:text-6xl font-black mb-6">
Instagram Downloader
</h1>

<p class="text-lg text-slate-600 dark:text-slate-400 mb-10 max-w-2xl mx-auto">
Download Instagram photos, videos, reels and stories in HD quality.
</p>

<a href="#downloader" class="bg-primary-600 text-white px-10 py-4 rounded-xl font-bold">
Start Downloading
</a>
</header>


<section id="downloader" class="py-12 px-6">
<div class="max-w-3xl mx-auto">

<div class="glass p-8 rounded-2xl">

<div class="mb-4">
<label class="block mb-2 font-bold">Instagram URL</label>
<input id="input-url" class="w-full p-3 rounded border" placeholder="https://instagram.com/reel/...">
</div>

<div class="text-center my-4 text-sm opacity-60">OR</div>

<div class="mb-6">
<label class="block mb-2 font-bold">Instagram Username</label>
<input id="input-user" class="w-full p-3 rounded border" placeholder="@username">
</div>

<button onclick="fetchMedia()" id="btn-fetch" class="w-full bg-black text-white py-4 rounded-xl font-bold">
Fetch Media
</button>

</div>
</div>
</section>


<section id="results-section" class="hidden py-12 px-6">

<div class="max-w-6xl mx-auto">

<div id="media-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

<div id="no-results" class="hidden text-center opacity-50 py-20">
No media found
</div>

</div>
</section>


<footer class="py-10 text-center border-t">
<p class="text-sm opacity-60">
© 2026 Flor Peña
</p>
</footer>


<div id="global-loader" class="fixed inset-0 hidden flex items-center justify-center bg-black/70 text-white text-xl">
Loading...
</div>


<script>

let currentLang='en'
let mockMedia=[]
let currentFilter='all'

window.onload=()=>{
lucide.createIcons()
initTheme()
}


function toggleDarkMode(){
document.documentElement.classList.toggle('dark')
}


function initTheme(){
if(localStorage.theme==='dark'){
document.documentElement.classList.add('dark')
}
}


function toggleLanguage(){
currentLang=currentLang==='en'?'es':'en'
document.getElementById('lang-label').innerText=currentLang==='en'?'ES':'EN'
}


async function fetchMedia(){

const inputUrl=document.getElementById('input-url').value
const inputUser=document.getElementById('input-user').value
const loader=document.getElementById('global-loader')

if(!inputUrl && !inputUser){
alert('Please enter URL or username')
return
}

loader.classList.remove('hidden')
loader.classList.add('flex')

try{

const response=await fetch("/api/instagram",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
url:inputUrl,
username:inputUser
})
})

if(!response.ok){
throw new Error("API error")
}

const data=await response.json()

mockMedia=data.media || data.data || []

renderGrid()

document.getElementById('results-section').classList.remove('hidden')

}catch(error){

console.error(error)
alert("Error connecting to server")

}finally{

loader.classList.add('hidden')
loader.classList.remove('flex')

}

}


function renderGrid(){

const grid=document.getElementById('media-grid')
const noResults=document.getElementById('no-results')

grid.innerHTML=""

if(!mockMedia || mockMedia.length===0){
noResults.classList.remove('hidden')
return
}else{
noResults.classList.add('hidden')
}

mockMedia.forEach(item=>{

const card=document.createElement('div')

card.className="border rounded-xl overflow-hidden"

card.innerHTML=`
<img src="${item.thumbnail || ''}" class="w-full">

<div class="p-4">

<button onclick="downloadMedia('${item.url || ''}')" class="w-full bg-primary-600 text-white py-2 rounded">
Download
</button>

</div>
`

grid.appendChild(card)

})

}


function downloadMedia(url){
if(!url){
alert("Download link not available")
return
}
window.open(url,"_blank")
}

</script>

</body>
</html>
